# Database Configuration for Docker
spring.datasource.url=jdbc:postgresql://localhost:5450/studentgest
spring.datasource.username=postgres
spring.datasource.password=ABCabc123

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=mySecretKeyForJWTGenerationInStudentGestApplication2024
jwt.expiration=900000

# Server Configuration - CAMBIA EL PUERTO AQUÍ
server.port=8084

# Security (para desarrollo)
spring.security.filter.order=10

# =============================================
# CONFIGURACIÓN DE EMAIL (GMAIL)
# =============================================

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=alejandromollinedorodriguez@gmail.com
spring.mail.password=aznzlybgtpljfztv

# Propiedades SMTP
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Configuración adicional para mejor compatibilidad
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# Debug (solo para desarrollo)
spring.mail.properties.mail.debug=true

# Configuración general
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8

# =============================================
# SECURITY LOGGING CONFIGURATION
# =============================================

# Logging for debugging
logging.level.com.studentgest.user_service=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=ERROR

# Configuración de logging de seguridad
logging.level.SECURITY_AUDIT=INFO
