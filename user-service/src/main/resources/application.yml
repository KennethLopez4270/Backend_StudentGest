  level:
    com.studentgest.user_service.security: DEBUG
    com.studentgest.user_service.service: DEBUG

# Configuración JWT de respaldo
app:
  jwt:
    secret: "mySecretKeyForJWTGenerationInStudentGestApplication2024"
    expiration: 900000 # 15 minutos en milisegundos